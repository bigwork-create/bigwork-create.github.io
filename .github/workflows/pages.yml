name: GitHub Pages (redirección al sitio oficial)

# bigwork-create.github.io solo redirige a https://hubert-app-001.web.app.
# El código completo de la web vive en este repositorio y se publica en Firebase Hosting.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generar páginas de redirección
        run: python3 herramientas/redirecciones.py _redireccion
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _redireccion
      - id: despliegue
        uses: actions/deploy-pages@v4
